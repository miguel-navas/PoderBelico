<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schwerer Gustav — modelo 3D</title>
<style>
  html,body{margin:0;height:100%;background:#080b0e;color:#f4f6f8;font-family:system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .painel{position:fixed;left:16px;top:16px;max-width:300px;background:#11161bcc;border:1px solid #2a343d;border-radius:8px;padding:12px 14px;backdrop-filter:blur(4px)}
  h1{margin:0 0 4px;font-size:18px;letter-spacing:.04em;color:#eee3bd}
  p{margin:2px 0;font-size:13px;color:#aab4be}
  .dados{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
  .dados b{color:#f4f6f8;font-weight:600}
  .botoes{position:fixed;right:16px;top:16px;display:flex;gap:8px}
  button{background:#171e25;color:#f4f6f8;border:1px solid #2a343d;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  button:hover,button[aria-pressed=true]{background:#eee3bd;color:#080b0e}
  .rodape{position:fixed;left:16px;bottom:12px;font-size:12px;color:#7d8791}
</style>
</head>
<body>
<canvas id="c" aria-label="Modelo 3D esquemático do canhão ferroviário Schwerer Gustav"></canvas>
<div class="painel">
  <h1>SCHWERER GUSTAV</h1>
  <p>Canhão ferroviário alemão de 80 cm (1941–1945)</p>
  <div class="dados">
    <span>Calibre</span><b>800 mm</b>
    <span>Massa</span><b>1.350 t</b>
    <span>Comprimento</span><b>47,3 m</b>
    <span>Cano</span><b>32,5 m</b>
    <span>Alcance</span><b>47 km</b>
    <span>Fabricante</span><b>Krupp</b>
  </div>
</div>
<div class="botoes">
  <button id="rot" aria-pressed="true">Girar</button>
  <button id="elev" aria-pressed="false">Elevar cano</button>
</div>
<div class="rodape">Arraste para girar · role para aproximar · modelo esquemático, não é réplica exata</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  var canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputEncoding=THREE.sRGBEncoding;
  var scene=new THREE.Scene();
  function sky(){var c=document.createElement('canvas');c.width=16;c.height=256;var g=c.getContext('2d');var gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#3d4a5a');gr.addColorStop(.55,'#8d8f8c');gr.addColorStop(.8,'#c9a77a');gr.addColorStop(1,'#a88f72');g.fillStyle=gr;g.fillRect(0,0,16,256);var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
  scene.background=sky();
  scene.fog=new THREE.Fog(0x9a8d78,70,300);
  function noiseTex(w,base,amp,rep){var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');var id=g.createImageData(256,256);for(var i=0;i<id.data.length;i+=4){var v=base+(Math.random()-.5)*amp;id.data.set([v,v,v,255],i);}g.putImageData(id,0,0);var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return t;}
  var nSteel=noiseTex(1,140,90,4),nGround=noiseTex(1,130,120,60),nBall=noiseTex(1,130,140,30);
  var camera=new THREE.PerspectiveCamera(40,1,0.5,600);
  camera.position.set(-40,24,55);
  var controls=new THREE.OrbitControls(camera,canvas);
  controls.target.set(2,9,0);
  controls.enableDamping=true;
  controls.maxPolarAngle=Math.PI/2-0.03;
  controls.minDistance=15;controls.maxDistance=150;

  scene.add(new THREE.HemisphereLight(0xbcc8d6,0x2a2f26,0.85));
  var sun=new THREE.DirectionalLight(0xffe6c0,0.9);
  sun.position.set(-50,45,35);sun.color.set(0xffd9a8);sun.intensity=1.25;sun.castShadow=true;sun.shadow.bias=-0.0004;
  sun.shadow.mapSize.set(2048,2048);
  var s=sun.shadow.camera;s.left=-70;s.right=70;s.top=40;s.bottom=-40;s.near=1;s.far=200;
  scene.add(sun);

  var steel=new THREE.MeshStandardMaterial({color:0x5a5f58,roughness:.72,metalness:.45,bumpMap:nSteel,bumpScale:.6,roughnessMap:nSteel});
  var dark=new THREE.MeshStandardMaterial({color:0x22262a,roughness:.8,metalness:.5,bumpMap:nSteel,bumpScale:.4});
  var camo=new THREE.MeshStandardMaterial({color:0x6d6a4f,roughness:.85,metalness:.25,bumpMap:nSteel,bumpScale:.7});
  var light=new THREE.MeshStandardMaterial({color:0x4c5256,roughness:.38,metalness:.8,bumpMap:nSteel,bumpScale:.3});
  var ground=new THREE.MeshStandardMaterial({color:0x56583d,roughness:1,bumpMap:nGround,bumpScale:1.2,map:nGround});
  var ballast=new THREE.MeshStandardMaterial({color:0x6a6259,roughness:1,bumpMap:nBall,bumpScale:2,map:nBall});

  function box(w,h,d,m,x,y,z,parent){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(parent||scene).add(o);return o;}
  function cyl(rt,rb,h,m,x,y,z,parent,rotZ,rotX){var o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,32),m);o.position.set(x,y,z);if(rotZ)o.rotation.z=rotZ;if(rotX)o.rotation.x=rotX;o.castShadow=o.receiveShadow=true;(parent||scene).add(o);return o;}

  var gnd=new THREE.Mesh(new THREE.PlaneGeometry(600,600),ground);
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
  box(130,0.5,14,ballast,0,0.25,0);

  // quatro trilhos (duas vias paralelas)
  [-3.6,-2.2,2.2,3.6].forEach(function(z){box(130,0.35,0.22,dark,0,0.65,z);});
  for(var x=-64;x<=64;x+=1.4){box(0.5,0.25,9.6,new THREE.MeshStandardMaterial({color:0x3b2f25,roughness:1}),x,0.5,0);}

  var gun=new THREE.Group();scene.add(gun);

  // truques (bogies) — dois grupos de 8 rodas por lado
  function bogie(cx,side){
    for(var i=0;i<4;i++){
      var x=cx-3.6+i*2.4;
      cyl(0.75,0.75,0.4,dark,x,1.35,side*3.6,gun,0,Math.PI/2);
      cyl(0.3,0.3,0.45,light,x,1.35,side*3.6,gun,0,Math.PI/2);
    }
    box(10,0.5,0.6,dark,cx,2.2,side*3.6,gun);
  }
  [-12,-2,8,18].forEach(function(cx){[-1,1].forEach(function(s){bogie(cx,s);});});
  // pares extras nas pontas
  [-24,22].forEach(function(cx){[-1,1].forEach(function(s){bogie(cx,s);});});

  // vigas principais do chassi
  [-1,1].forEach(function(s){
    box(54,1.6,1.6,steel,-2,3.2,s*3.4,gun);
    box(54,0.8,1.2,dark,-2,2.4,s*3.4,gun);
  });
  box(54,1.0,8,steel,-2,4.2,0,gun);
  // estrutura reticulada lateral
  for(var i=-12;i<=12;i++){
    [-1,1].forEach(function(s){
      var d=box(0.25,6,0.25,steel,-2+i*2,6.2,s*3.6,gun);
    });
  }
  box(54,0.3,0.3,steel,-2,9,3.6,gun);box(54,0.3,0.3,steel,-2,9,-3.6,gun);
  box(54,0.3,0.3,steel,-2,5,3.6,gun);box(54,0.3,0.3,steel,-2,5,-3.6,gun);

  // casamata/berço central
  box(16,6,9,camo,-1,8,0,gun);box(4,2.2,9.4,camo,6,9.6,0,gun);
  // rebites/escadas/corrimões
  for(var r=0;r<26;r++){[-1,1].forEach(function(q){cyl(0.12,0.12,0.15,light,-8.5+r*0.7,10.6,q*4.55,gun,0,Math.PI/2);});}
  [-1,1].forEach(function(q){box(12,0.12,0.12,light,-2,11.4,q*4.7,gun);box(12,0.12,0.12,light,-2,10.7,q*4.7,gun);for(var p=0;p<7;p++)box(0.12,1.0,0.12,light,-7.5+p*2,11,q*4.7,gun);});
  for(var e=0;e<9;e++)box(0.12,0.12,3.4,light,12+e*0.6,5.2+e*0.6,-5,gun);
  box(6,3,10,dark,-1,12,0,gun);

  // guindastes de popa
  [-1,1].forEach(function(s){
    box(0.6,12,0.6,steel,-22,10,s*3,gun);box(0.6,12,0.6,steel,-26,10,s*3,gun);
    box(5,0.6,0.6,steel,-24,16,s*3,gun);
  });
  box(5,0.6,6.6,dark,-24,16.3,0,gun);

  // cano e culatra num pivot elevável
  var pivot=new THREE.Group();pivot.position.set(-1,11,0);gun.add(pivot);
  var elev=THREE.MathUtils.degToRad(18);
  pivot.rotation.z=elev;
  cyl(2.0,2.0,9,steel,-3.5,0,0,pivot,Math.PI/2);        // culatra
  cyl(1.7,1.6,13,steel,6.5,0,0,pivot,Math.PI/2);        // câmara
  cyl(1.5,1.2,32.5,light,29,0,0,pivot,Math.PI/2);       // cano
  cyl(1.56,1.56,1.6,new THREE.MeshStandardMaterial({color:0xd8d4c8,roughness:.6,metalness:.2}),38,0,0,pivot,Math.PI/2);
  cyl(1.35,1.35,1.2,dark,46,0,0,pivot,Math.PI/2);       // boca
  cyl(1.55,1.55,0.8,dark,18,0,0,pivot,Math.PI/2);       // anéis de reforço
  cyl(1.45,1.45,0.8,dark,32,0,0,pivot,Math.PI/2);
  // munhões
  [-1,1].forEach(function(s){cyl(1.2,1.2,2.4,dark,0,0,s*3.6,pivot,0,Math.PI/2);});

  gun.position.y=0;

  function resize(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();

  var rot=true,target=elev,elevado=false;
  var bRot=document.getElementById('rot'),bEl=document.getElementById('elev');
  bRot.onclick=function(){rot=!rot;bRot.setAttribute('aria-pressed',rot);};
  bEl.onclick=function(){elevado=!elevado;bEl.setAttribute('aria-pressed',elevado);target=THREE.MathUtils.degToRad(elevado?45:18);};
  controls.addEventListener('start',function(){rot=false;bRot.setAttribute('aria-pressed',false);});

  var t0=performance.now();
  (function loop(){
    requestAnimationFrame(loop);
    var dt=(performance.now()-t0)/1000;t0=performance.now();
    pivot.rotation.z+=(target-pivot.rotation.z)*Math.min(1,dt*3);
    if(rot){var a=dt*0.25,x=camera.position.x-controls.target.x,z=camera.position.z-controls.target.z;
      camera.position.x=controls.target.x+x*Math.cos(a)-z*Math.sin(a);
      camera.position.z=controls.target.z+x*Math.sin(a)+z*Math.cos(a);}
    controls.update();renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
